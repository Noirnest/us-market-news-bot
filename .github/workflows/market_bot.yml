name: US Market News & Ratings Bot

on:
  schedule:
    # 09:00 AM New York time (30 mins before US Market Open, Mon-Fri)
    - cron: '0 9 * * 1-5'
      timezone: 'America/New_York'
    # 03:30 PM New York time (30 mins before US Market Close, Mon-Fri)
    - cron: '30 15 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch: # Lets you click "Run workflow" manually anytime

permissions:
  contents: write

jobs:
  collect-and-rank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect, rank with Gemini, and generate report
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Commit and push report to GitHub
        run: |
          git config --global user.name "MarketImpactBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add reports/ README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "📈 Market Impact Report ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
